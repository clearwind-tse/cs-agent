<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Aurora Design Lab — AiWxChat 流体极光设计系统组件预览" />
    <title>Aurora Design Lab · 组件预览</title>
    <script>
      (function () {
        try {
          var query = new URLSearchParams(window.location.search).get('theme');
          var stored = localStorage.getItem('acp-theme');
          var resolved = query === 'light' || query === 'dark'
            ? query
            : (stored === 'light' || stored === 'dark'
              ? stored
              : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
          document.documentElement.classList.remove('dark', 'light');
          document.documentElement.classList.add(resolved);
          document.documentElement.dataset.theme = resolved;
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/styleguide/main.tsx"></script>
  </body>
</html>
